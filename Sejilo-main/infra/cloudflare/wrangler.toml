name = "sejilo-edge"
main = "worker.js"
compatibility_date = "2024-09-23"
account_id = "${CLOUDFLARE_ACCOUNT_ID}"

# Worker is bound to the API subdomain only. It reverse-proxies /api to the
# origin (Cloudflare Tunnel public hostname or origin IP) and injects edge
# security headers. Set ORIGIN_HOST as a secret:
#   wrangler secret put ORIGIN_HOST   # e.g. https://tunnel-id.cfargotunnel.com
[vars]
ENVIRONMENT = "production"

routes = [
  { pattern = "api.sejilo.chat/*", custom_domain = true }
]
