<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<title>SejiloChat social card</title>
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background:
      radial-gradient(900px 520px at 12% 18%, #103042 0%, rgba(16,48,66,0) 62%),
      radial-gradient(760px 520px at 88% 92%, #241540 0%, rgba(36,21,64,0) 60%),
      #070A12;
    color: #F8FAFC;
    font-family: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    box-sizing: border-box;
    padding: 0 84px;
  }
  .row { display: flex; align-items: center; gap: 40px; }
  .row img { width: 168px; height: 168px; display: block; }
  h1 {
    font-size: 92px;
    line-height: 1;
    margin: 0;
    letter-spacing: -0.02em;
    font-weight: 700;
  }
  h1 span { color: #6EE7C4; }
  p.tag {
    font-size: 40px;
    line-height: 1.3;
    margin: 40px 0 0;
    color: #CBD5E1;
    max-width: 940px;
  }
  p.tag b { color: #F8FAFC; font-weight: 600; }
  .meta {
    margin-top: 44px;
    display: flex;
    gap: 14px;
    font-size: 26px;
    color: #94A3B8;
  }
  .meta span {
    border: 1px solid #1E293B;
    border-radius: 999px;
    padding: 10px 22px;
    background: #0D1220;
  }
  .bar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 10px;
    background: linear-gradient(90deg, #22D3EE, #8B5CF6 55%, #EC4899);
  }
</style>
</head>
<body>
  <div class="row">
    <img src="mark.png" alt="">
    <h1>Sejilo<span>Chat</span></h1>
  </div>
  <p class="tag">Chat with or without internet. Messages travel over the
  network when there is one, and <b>hop between nearby phones over
  Bluetooth</b> when there is not.</p>
  <div class="meta">
    <span>Android</span>
    <span>Windows</span>
    <span>Works with no signal</span>
  </div>
  <div class="bar"></div>
</body>
</html>
