name: sejilo

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sejilo}
      POSTGRES_USER: ${POSTGRES_USER:-sejilo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - sejilo-postgres:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - sejilo-redis:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-sejilo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sejilo}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      TOKEN_PEPPER: ${TOKEN_PEPPER:?Set a random TOKEN_PEPPER in .env}
      METRICS_TOKEN: ${METRICS_TOKEN:?Set a separate METRICS_TOKEN in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_CIPHERTEXT_BYTES: ${MAX_CIPHERTEXT_BYTES:-196608}
      MAX_QUEUED_MESSAGES_PER_DEVICE: ${MAX_QUEUED_MESSAGES_PER_DEVICE:-2000}
      MAX_QUEUED_BYTES_PER_DEVICE: ${MAX_QUEUED_BYTES_PER_DEVICE:-268435456}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-900}
      REFRESH_TTL_SECONDS: ${REFRESH_TTL_SECONDS:-2592000}
      MAX_DEVICE_REQUESTS_PER_MINUTE: ${MAX_DEVICE_REQUESTS_PER_MINUTE:-300}
      MAX_MESSAGES_PER_MINUTE: ${MAX_MESSAGES_PER_MINUTE:-60}
      MAX_SOCKETS_PER_DEVICE: ${MAX_SOCKETS_PER_DEVICE:-4}
      USER_SESSION_TTL_SECONDS: ${USER_SESSION_TTL_SECONDS:-2592000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      PASSWORD_RESET_FROM: ${PASSWORD_RESET_FROM:-}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-}
      WEB_ALLOWED_ORIGIN: ${WEB_ALLOWED_ORIGIN:-}
      # Public exposure (Cloudflare Tunnel): browser origins allowed to call the
      # API, whether forwarded client-IP headers are believed, and whether the
      # OpenAPI browser is published. See backend/src/common/config/cors.config.ts.
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      # The container's root filesystem is read-only, so point npm's cache at the
      # tmpfs; the entrypoint shells out to `npx prisma migrate deploy` on boot.
      NPM_CONFIG_CACHE: /tmp/.npm
      # Optional integrations (empty = disabled). Define them in .env
      # No GOOGLE_CLIENT_SECRET: this flow verifies an ID token rather than
      # exchanging an authorization code, so nothing reads one.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      SMS_ACCOUNT_SID: ${SMS_ACCOUNT_SID:-}
      SMS_AUTH_TOKEN: ${SMS_AUTH_TOKEN:-}
      SMS_FROM_NUMBER: ${SMS_FROM_NUMBER:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL:-}
      FCM_PRIVATE_KEY: ${FCM_PRIVATE_KEY:-}
    ports:
      - "${SEJILO_API_PORT:-8080}:8080"
    networks: [backend, edge]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  workspace:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
    image: sejilo-workspace:dev
    volumes:
      - .:/app:cached
    working_dir: /app
    stdin_open: true
    tty: true
    command: /bin/bash

volumes:
  sejilo-postgres:
  sejilo-redis:

networks:
  backend:
    internal: true
  edge:
